# Authentication and TLS security configuration.
# Demo scenario C: both branches will change the SAME security-critical
# keys to DIFFERENT values (auth provider, TLS version, MFA policy).
# YAML cannot hold two values for one key, and picking either side is a
# security-policy decision that requires human judgment.
# LLM should return cannot_resolve → bot posts a failure comment on the PR.

security:
  auth_provider: internal-sso
  tls_min_version: "1.2"
  session_timeout_minutes: 60
  require_mfa: false
  allowed_origins:
    - https://app.company.com
  api_key_rotation_days: 90
