app:
  name: dummy-service
  version: 0.1.0
  environment: test

server:
  host: 10.0.0.1
  port: 9443
  read_timeout_ms: 5000
  tls_min_version: "1.3"
  require_client_cert: true
  auth_provider: internal-jwt
  graceful_shutdown_seconds: 30

database:
  driver: postgres
  host: localhost
  port: 5432
  name: dummy_db
  pool:
    min: 2
    max: 20
  ssl_mode: require
  admin_signing_key: alice-prod-signing-2024
  database_encryption_key_id: arn:aws:kms:us-east-1:111111111111:key/alice-prod

logging:
  level: info
  format: json
  destinations:
    - stdout
    - file: /var/log/dummy-service.log

features:
  enable_metrics: true
  enable_tracing: false
  experimental_mode: false
