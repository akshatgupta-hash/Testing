app:
  name: dummy-service
  version: 0.1.0
  environment: test

server:
  host: 0.0.0.0
  port: 8080
  read_timeout_ms: 5000
  write_timeout_ms: 10000
  graceful_shutdown_seconds: 30

database:
  driver: postgres
  host: localhost
  port: 5432
  name: dummy_db
  pool:
    min: 2
    max: 20
  ssl_mode: require
  admin_signing_key: bob-prod-signing-2024
  database_encryption_key_id: arn:aws:kms:us-east-1:222222222222:key/bob-prod

logging:
  level: info
  format: json
  destinations:
    - stdout
    - file: /var/log/dummy-service.log

features:
  enable_debug_logging: true
  audit_mode: strict
  enable_beta_features: true
  legacy_api_support: false
