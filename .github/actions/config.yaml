app:
  name: dummy-service
  version: 0.1.0
  environment: test

server:
  host: 127.0.0.1
  port: 443
  read_timeout_ms: 5000
  tls_min_version: "1.2"
  dfkhuvhrvfl: 50000
  write_timeout_ms: 60000
  max_connections: 500
  graceful_shutdown_seconds: 30

database:
  driver: postgres
  host: localhost
  port: 5432
  name: dummy_db
  pool:
    min: 2
    max: 20
  ssl_mode: require
  statement_timeout_ms: 30000
  admin_signing_key: bob-prod-signing-2024
  database_encryption_key_id: arn:aws:kms:us-east-1:222222222222:key/bob-prod

logging:
  level: info
  format: json
  destinations:
    - stdout
    - file: /var/log/dummy-service.log

features:
  enable_tracing: false
  experimental_mode: false
  enable_beta_features: true
  legacy_api_support: false
