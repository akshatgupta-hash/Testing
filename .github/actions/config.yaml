app:
  name: dummy-service
  version: 0.1.0
  environment: test

server:
  host: 0.0.0.0
  port: 8080
  read_timeout_ms: 5000
  write_timeout_ms: 10000

database:
  driver: postgres
  host: localhost
  port: 5432
  name: dummy_db
  pool:
    min: 2
    max: 20

logging:
  level: info
  format: json
  destinations:
    - stdout
    - file: /var/log/dummy-service.log

features:
  enable_metrics: true
  enable_tracing: false
  experimental_mode: false
